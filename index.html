<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Playground Portfolio (Persona Carousel)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script type="importmap">
        { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
        }
    </script>
</head>
<body>

    <canvas id="world-canvas"></canvas>
    <div id="ui-layer"></div>

    <div id="carousel-container">
        <button class="carousel-btn" id="prev-persona">❮</button>
        <div class="persona-card">
            <div class="persona-name" id="p-name">Loading...</div>
            <div class="persona-desc" id="p-desc">-</div>
        </div>
        <button class="carousel-btn" id="next-persona">❯</button>
    </div>

    <div id="speech-bubble" role="dialog" aria-live="polite">
        <div class="bubble-col-1">
            <div id="dom-avatar-el" class="dom-avatar"></div>
        </div>
        <div class="bubble-col-2">
            <h3 id="bubble-title">Title</h3>
            <div id="bubble-text" class="typing-cursor"></div>
            <div id="bubble-footer"></div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
